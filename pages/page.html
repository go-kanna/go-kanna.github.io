<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>{{name}} — kanna</title>
<meta name="description" content="{{description}}">
<meta property="og:title" content="{{name}}">
<meta property="og:description" content="{{description}}">
<meta property="og:image" content="https://raw.githubusercontent.com/go-kanna/kanna/main/assets/logo/avatar-blade.png">
<meta property="og:type" content="article">
<meta name="theme-color" content="#0B1A21">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 256 256'%3E%3Crect width='256' height='256' rx='56' fill='%2300ADD8'/%3E%3Cg transform='translate(5.22 4.12) scale(0.9592)'%3E%3Cpolygon points='34,184 222,184 226,180 226,137 213,124 43,124 30,137 30,180' fill='%230B1A21'/%3E%3Cpolygon points='96,184 116.5,184 214,97.1 213.7,88.6 198.3,74.3' fill='%23fff'/%3E%3C/g%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..800&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #0B1A21;
    --blade: #00ADD8;
    --deep: #00708A;
    --steel: #7F98A3;
    --paper: #F2F6F7;
    --white: #FFFFFF;
    --rule: #D3DFE3;

    --sans: "Archivo", "Helvetica Neue", Arial, sans-serif;
    --mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;

    --gutter: clamp(1.25rem, 4vw, 3rem);
  }

  * { box-sizing: border-box; }

  html { -webkit-text-size-adjust: 100%; scroll-behavior: smooth; }

  body {
    margin: 0;
    background: var(--paper);
    color: var(--ink);
    font-family: var(--sans);
    font-size: 1.0625rem;
    line-height: 1.65;
    font-stretch: 100%;
  }

  a { color: var(--deep); text-underline-offset: 0.18em; text-decoration-thickness: 1px; }
  a:hover { color: var(--ink); }
  :focus-visible { outline: 3px solid var(--blade); outline-offset: 3px; border-radius: 2px; }

  .wrap { max-width: 76rem; margin: 0 auto; padding: 0 var(--gutter); }

  /* Header, as on the landing page */
  .bar { padding-block: 1.5rem; padding-top: calc(1.5rem + env(safe-area-inset-top, 0px)); }
  .bar .wrap { display: flex; align-items: center; justify-content: space-between; gap: 1.5rem; }
  .brand { display: inline-flex; align-items: center; gap: 0.7rem; color: var(--ink); text-decoration: none; }
  .brand svg { width: 2.25rem; height: 2.25rem; display: block; }
  .brand span { font-weight: 800; font-stretch: 110%; font-size: 1.35rem; letter-spacing: -0.01em; }
  .bar nav { display: flex; gap: 1.75rem; font-size: 1rem; }
  .bar nav a { color: var(--ink); text-decoration: none; }
  .bar nav a:hover { color: var(--deep); text-decoration: underline; }

  /* Title */
  .head { padding-block: clamp(1.5rem, 4vw, 3rem) clamp(1.5rem, 3vw, 2.5rem); }
  .crumb { margin: 0 0 0.75rem; font-family: var(--mono); font-size: 0.875rem; color: var(--deep); }
  .crumb a { color: inherit; text-decoration: none; }
  .crumb a:hover { text-decoration: underline; }
  h1 {
    margin: 0;
    font-weight: 800; font-stretch: 110%;
    font-size: clamp(2.2rem, 4.5vw, 3.4rem);
    line-height: 1.05; letter-spacing: -0.03em;
  }

  /* The README, with its sections listed beside it */
  .doc {
    display: grid;
    grid-template-columns: minmax(0, 1fr) 15rem;
    gap: clamp(2rem, 5vw, 5rem);
    align-items: start;
    padding-bottom: clamp(4rem, 8vw, 6rem);
  }
  .toc { position: sticky; top: calc(1.5rem + env(safe-area-inset-top, 0px)); font-size: 0.9375rem; }
  .toc p { margin: 0 0 0.6rem; font-size: 0.75rem; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: #4A606A; }
  .toc ol { list-style: none; margin: 0; padding: 0; }
  .toc ol ol { padding-left: 1rem; }
  .toc li { margin: 0.35rem 0; }
  .toc a { color: var(--ink); text-decoration: none; }
  .toc a:hover { color: var(--deep); text-decoration: underline; }
  .toc code { font-family: var(--mono); font-size: 0.86em; }

  .readme { max-width: 46rem; min-width: 0; }
  .readme > :first-child { margin-top: 0; }
  .readme h2 {
    margin: 2.75rem 0 1rem; padding-top: 1.25rem;
    border-top: 1px solid var(--rule);
    font-weight: 800; font-stretch: 110%;
    font-size: 1.75rem; line-height: 1.15; letter-spacing: -0.02em;
  }
  .readme h3 { margin: 2rem 0 0.75rem; font-weight: 700; font-stretch: 104%; font-size: 1.25rem; letter-spacing: -0.01em; }
  .readme h4 { margin: 1.5rem 0 0.5rem; font-size: 1.0625rem; }
  .readme p, .readme ul, .readme ol, .readme blockquote { margin: 0 0 1.1rem; }
  .readme li { margin: 0.3rem 0; }
  .readme li > p { margin: 0; }
  .readme blockquote { padding-left: 1rem; border-left: 3px solid var(--rule); color: #2E4651; }
  .readme hr { border: 0; border-top: 1px solid var(--rule); margin: 2rem 0; }
  .readme img { max-width: 100%; vertical-align: middle; }

  .readme code { font-family: var(--mono); font-size: 0.86em; }
  .readme :not(pre) > code { background: #E3EBEE; padding: 0.1em 0.35em; border-radius: 4px; overflow-wrap: anywhere; }
  .readme pre {
    margin: 0 0 1.25rem; padding: 1.1rem 1.3rem;
    background: var(--ink); color: #D6E2E7;
    border-radius: 10px;
    overflow-x: auto;
    font-family: var(--mono); font-size: 0.8125rem; line-height: 1.65;
    tab-size: 4;
  }
  .readme pre code { font-size: inherit; }
  .readme .highlight { margin: 0 0 1.25rem; }
  .readme .highlight pre { margin: 0; }

  .readme .table { overflow-x: auto; margin: 0 0 1.25rem; }
  .readme table { border-collapse: collapse; width: 100%; font-size: 0.9375rem; line-height: 1.5; }
  .readme th, .readme td { padding: 0.55rem 0.75rem; border: 1px solid var(--rule); text-align: left; vertical-align: top; }
  .readme th { background: var(--white); font-weight: 700; }

  /* Syntax colors: GitHub's classes, in the landing page's palette */
  .pl-k { color: var(--blade); }
  .pl-s, .pl-pds, .pl-sr, .pl-cce, .pl-c1 { color: #8FD4E6; }
  .pl-c { color: var(--steel); }
  .pl-smi, .pl-ent, .pl-v { color: var(--white); }
  .pl-en { color: #F0F6F8; font-weight: 500; }
  .highlight-text-shell-session .pl-s1 { color: var(--white); }
  .highlight-text-shell-session .pl-c1 { color: #D6E2E7; }

  footer { padding-block: 2.5rem; padding-bottom: calc(2.5rem + env(safe-area-inset-bottom, 0px)); font-size: 0.9375rem; color: #4A606A; border-top: 1px solid var(--rule); }
  footer .wrap { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 1rem; }

  @media (max-width: 64rem) {
    .doc { grid-template-columns: minmax(0, 1fr); gap: 2rem; }
    .toc { position: static; order: -1; padding: 1.1rem 1.25rem; background: var(--white); border: 1px solid var(--rule); border-radius: 10px; }
  }
  @media (max-width: 30rem) {
    .bar nav { gap: 1.1rem; font-size: 0.9375rem; }
    .bar nav .wide { display: none; }
    .readme pre { padding: 1rem 1.1rem; font-size: 0.75rem; }
  }
</style>
</head>
<body>
<header class="bar">
  <div class="wrap">
    <a class="brand" href="../" aria-label="kanna home">
      <svg viewBox="0 0 256 256" aria-hidden="true"><rect width="256" height="256" rx="56" fill="#00ADD8"/><g transform="translate(5.22 4.12) scale(0.9592)"><polygon points="34,184 222,184 226,180 226,137 213,124 43,124 30,137 30,180" fill="#0B1A21"/><polygon points="96,184 116.5,184 214,97.1 213.7,88.6 198.3,74.3" fill="#FFFFFF"/><polygon points="116.5,162.1 183.3,90.4 178.2,85.6 111.3,157.3" fill="#7F98A3"/></g></svg>
      <span>kanna</span>
    </a>
    <nav aria-label="Site">
      <a href="../#tools">Tools</a>
      <a class="wide" href="https://pkg.go.dev/github.com/go-kanna/{{repo}}">pkg.go.dev</a>
      <a href="https://github.com/go-kanna/{{repo}}">GitHub</a>
    </nav>
  </div>
</header>

<main class="wrap">
  <header class="head">
    <p class="crumb"><a href="../">kanna</a> / {{repo}}</p>
    <h1>{{name}}</h1>
  </header>
  <div class="doc">
    <article class="readme">
{{body}}
    </article>
    <nav class="toc" aria-label="On this page">
      <p>On this page</p>
      {{toc}}
    </nav>
  </div>
</main>

<footer>
  <div class="wrap">
    <span>MIT licensed.</span>
    <span>This page is the <a href="https://github.com/go-kanna/{{repo}}#readme">README of go-kanna/{{repo}}</a>.</span>
  </div>
</footer>
</body>
</html>
