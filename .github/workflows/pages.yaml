name: Pages

on:
  push:
    branches:
      - main
  # Once a day as well, so that the tool pages follow the READMEs and the
  # versions on the landing page follow the tags.
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

# One deployment at a time, and never cancel one halfway.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/configure-pages@v6.0.0

      # The landing page and the logo as they are, and a page per tool from
      # its README, fetched and rendered through the GitHub API.
      - run: python3 pages/render.py --out _site
        env:
          GH_TOKEN: ${{ github.token }}

      - uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v5.0.1
